# SonarQube Cloud scanner configuration (run by CI on every push and PR;
# see .github/workflows/sonarqube.yml).
#
# SonarQube Cloud requires sonar.organization and namespaces the project key
# as <owner>_<repo>. Confirm both against the values Cloud assigns at import
# (Administration -> Information).
sonar.organization=alteredparadox
sonar.projectKey=AlteredParadox_handrail-ca
sonar.projectName=handrail-ca
sonar.sourceEncoding=UTF-8

# Standard Go layout: everything is a source, *_test.go is the test set.
sonar.sources=.
sonar.tests=.
sonar.test.inclusions=**/*_test.go

# Exclusions, each for a concrete reason:
#   *_test.go      — the test set (declared above), not sources.
#   **/testdata/** — Go test fixtures; data, not code.
sonar.exclusions=**/*_test.go,**/testdata/**

# Go coverage from `go test -coverprofile` (produced by the workflow).
sonar.go.coverage.reportPaths=coverage.out

# Coverage is imported for Go ONLY. The embedded front end has no coverage
# report, so counting it would only drag new-code coverage down. This is a
# COVERAGE exclusion only: the files stay in sonar.sources and are still
# analysed for bugs and smells.
sonar.coverage.exclusions=internal/web/static/**

# Deliberate rule exceptions belong HERE, not in the Cloud UI: issue
# resolutions live in the server's database and do not survive a project or
# platform move, whereas this file is in git. Add them as
# sonar.issue.ignore.multicriteria entries with a comment saying why.
sonar.issue.ignore.multicriteria=e1,e2,e3,e4,e5,e6

# e1: cognitive complexity in TESTS ONLY. Table-driven tests are the house
# style, and the metric counts every table row and per-step assertion
# against the single test function, which is the shape we want.
sonar.issue.ignore.multicriteria.e1.ruleKey=go:S3776
sonar.issue.ignore.multicriteria.e1.resourceKey=**/*_test.go

# e2: base images carry both the tag and the digest on purpose: the digest
# pins the image, the tag keeps the pin readable and is what Dependabot
# (docker ecosystem) bumps (see the Dockerfile's header).
sonar.issue.ignore.multicriteria.e2.ruleKey=docker:S8431
sonar.issue.ignore.multicriteria.e2.resourceKey=Dockerfile

# e3: "Using HTTP protocol is insecure" for the one http:// literal in
# main.go: the container healthcheck probing the server's own /healthz at
# its listen address. The request never leaves the host and the server does
# not terminate TLS itself. Scoped to that file; if the server ever serves TLS
# natively the probe must follow it and this entry goes away.
sonar.issue.ignore.multicriteria.e3.ruleKey=go:S5332
sonar.issue.ignore.multicriteria.e3.resourceKey=cmd/handrail-ca/main.go

# e4: "Omitting the Secure flag makes cookie insecure" for the cookies set in
# internal/web/auth.go. The flag is not a literal true there because it
# follows the public URL: true for every https address, false only when the
# public URL is http://, which the server accepts for loopback names alone
# (localhost, 127.0.0.1, ::1; see build() in web.go). A Secure cookie over
# plain HTTP on loopback is not kept by every browser, so forcing it would
# break local use without protecting anything: that traffic never leaves
# the machine. The tests assert Secure, and the __Host- prefix, over https.
# Added at the owner's instruction (2026-11-11). Scoped to that file.
sonar.issue.ignore.multicriteria.e4.ruleKey=go:S2092
sonar.issue.ignore.multicriteria.e4.resourceKey=internal/web/auth.go

# e5: "Server certificates should be verified" for the one request in
# internal/ca/client.go that fetches the CA's root certificate by its
# fingerprint (fetchRoot). The root that would verify that connection is the
# thing being fetched, so the standard check cannot run there. The answer is
# accepted only if its SHA-256 is the operator's configured fingerprint and
# the certificate the server presented on that connection chains to it for
# the configured host name; every other request uses a client that trusts
# that root alone, and the tests assert that client does not skip
# verification. Fetching by fingerprint, and this exception, are the owner's
# decisions (2026-11-11). Scoped to the file; AGENTS.md forbids a second
# request of this kind. (e4 is the cookie entry, on the sign-in change.)
sonar.issue.ignore.multicriteria.e5.ruleKey=go:S4830
sonar.issue.ignore.multicriteria.e5.resourceKey=internal/ca/client.go

# e6: "Enable server hostname verification" for the same statement in the
# same function. SonarCloud reports the one setting under two rules, this
# and e5; the reason and the owner's decision are those of e5. The host name
# is in fact checked: fetchRoot verifies the certificate the server
# presented against the fetched root for the configured host name before
# accepting the root, and a test reaches the right CA under a name its
# certificate does not carry to prove the refusal.
sonar.issue.ignore.multicriteria.e6.ruleKey=go:S5527
sonar.issue.ignore.multicriteria.e6.resourceKey=internal/ca/client.go
