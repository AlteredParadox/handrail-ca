# SonarQube Cloud scanner configuration (run by CI on every push and PR;
# see .github/workflows/sonarqube.yml).
#
# SonarQube Cloud requires sonar.organization and namespaces the project key
# as <owner>_<repo>. Confirm both against the values Cloud assigns at import
# (Administration -> Information).
sonar.organization=alteredparadox
sonar.projectKey=AlteredParadox_handrail-ca
sonar.projectName=handrail-ca
sonar.sourceEncoding=UTF-8

# Standard Go layout: everything is a source, *_test.go is the test set.
sonar.sources=.
sonar.tests=.
sonar.test.inclusions=**/*_test.go

# Exclusions, each for a concrete reason:
#   *_test.go      — the test set (declared above), not sources.
#   **/testdata/** — Go test fixtures; data, not code.
sonar.exclusions=**/*_test.go,**/testdata/**

# Go coverage from `go test -coverprofile` (produced by the workflow).
sonar.go.coverage.reportPaths=coverage.out

# Coverage is imported for Go ONLY. The embedded front end has no coverage
# report, so counting it would only drag new-code coverage down. This is a
# COVERAGE exclusion only: the files stay in sonar.sources and are still
# analysed for bugs and smells.
sonar.coverage.exclusions=internal/web/static/**

# Deliberate rule exceptions belong HERE, not in the Cloud UI: issue
# resolutions live in the server's database and do not survive a project or
# platform move, whereas this file is in git. Add them as
# sonar.issue.ignore.multicriteria entries with a comment saying why.
sonar.issue.ignore.multicriteria=e1,e2

# e1: cognitive complexity in TESTS ONLY. Table-driven tests are the house
# style, and the metric counts every table row and per-step assertion
# against the single test function, which is the shape we want.
sonar.issue.ignore.multicriteria.e1.ruleKey=go:S3776
sonar.issue.ignore.multicriteria.e1.resourceKey=**/*_test.go

# e2: base images carry both the tag and the digest on purpose: the digest
# pins the image, the tag keeps the pin readable and is what Dependabot
# (docker ecosystem) bumps (see the Dockerfile's header).
sonar.issue.ignore.multicriteria.e2.ruleKey=docker:S8431
sonar.issue.ignore.multicriteria.e2.resourceKey=Dockerfile
