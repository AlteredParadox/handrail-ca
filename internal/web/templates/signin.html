{{define "content"}}
<form class="card signin" method="post" action="{{.Base}}/sign-in">
<div>
<h1>Sign in</h1>
<p class="muted">Certificates for <span class="mono ink">{{.CAHost}}</span></p>
</div>
{{with .Data.Problem}}<p class="problem" role="alert">{{.}}</p>{{end}}
<input type="hidden" name="form_token" value="{{.Data.FormToken}}">
<div class="field">
<label for="username">User name</label>
<input id="username" name="username" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" maxlength="64" required value="{{.Data.Username}}">
</div>
<div class="field">
<label for="password">Password</label>
<input id="password" name="password" type="password" autocomplete="current-password" maxlength="1024" required>
</div>
<button type="submit" class="primary">Sign in</button>
</form>
{{end}}
