# Merge gate: the checks a change must pass. `make vet` (gofmt + go vet),
# `make build` and `make test` are the project's own targets, so CI runs
# exactly what a developer runs locally; the race suite runs separately.
#
# Branch protection on main requires `check`, `vuln` and `image` from here,
# and `scan` from sonarqube.yml.
name: ci

# push only on main; branch pushes are covered by their pull_request run,
# so PRs (including Dependabot's) don't run this twice.
on:
  push:
    branches: [main]
  pull_request:

# Least privilege: these jobs only read the repo.
permissions:
  contents: read

# A new push to the same ref supersedes the previous run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # Actions pinned to full commit SHAs (a retagged action can't change
      # under us); the trailing comment records the tag. Keep the comment at
      # the FULL version — Dependabot only refreshes a comment that already
      # carries one, and a bare "# v7" silently goes stale as the SHA moves.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # gofmt -l (fails on any unformatted file) + go vet ./...
      - name: make vet
        run: make vet

      # Every first-party source carries the AGPL notice. Cheap and offline,
      # so unlike notices-check this one is safe to gate every PR on —
      # Dependabot never touches source headers.
      - name: make license-check
        run: make license-check

      # The trimmed static binary the README documents.
      - name: make build
        run: make build

      - name: make test
        run: make test

      - name: Race tests
        run: go test -race ./...

  # Known-vulnerability scan of what the binary actually links (stdlib
  # included). Its own job so a fresh stdlib advisory shows up as `vuln`
  # rather than as a failed build; the fix is bumping the `go` line in
  # go.mod, which is what this job exists to flag. Symbol-level, so
  # advisories in code we don't call are informational only. Required on
  # main: a certificate-authority front end does not merge over a known
  # reachable vulnerability.
  vuln:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  # The container image builds and starts. Its own job: it repeats the Go
  # build inside Docker, and its failure modes (registry hiccups, a
  # base-image digest moving) are told apart from a failed `check` this way.
  # amd64 only here; the release workflow builds both arches and pushes.
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: handrail-ca:ci
          build-args: VERSION=ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # Smoke test: the distroless image starts as nonroot, hardened
      # (read-only root filesystem, every capability dropped,
      # no-new-privileges), reports the stamped version, serves the license
      # the AGPL requires it to offer, and its own HEALTHCHECK turns healthy.
      - name: Run image
        run: |
          docker run --rm handrail-ca:ci version | grep -qx 'handrail-ca ci' || { echo "version stamp missing"; exit 1; }
          docker run -d --name smoke --read-only --cap-drop ALL --security-opt no-new-privileges \
            --health-interval 2s -p 127.0.0.1:8080:8080 handrail-ca:ci
          for i in $(seq 1 30); do
            if out=$(curl -sf http://127.0.0.1:8080/healthz); then break; fi
            sleep 1
          done
          echo "$out" | grep -q '"version":"ci"' || { docker logs smoke; exit 1; }
          curl -sf http://127.0.0.1:8080/license | grep -q 'GNU AFFERO GENERAL PUBLIC LICENSE' || { echo "/license missing"; docker logs smoke; exit 1; }
          for i in $(seq 1 30); do
            health=$(docker inspect -f '{{.State.Health.Status}}' smoke)
            [ "$health" = healthy ] && break
            sleep 1
          done
          [ "$health" = healthy ] || { echo "health: $health"; docker inspect -f '{{json .State.Health}}' smoke; docker logs smoke; exit 1; }
          docker stop smoke >/dev/null
